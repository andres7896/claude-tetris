name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Ignorar issues que en realidad son PRs y ediciones hechas por bots
    if: github.event.issue.pull_request == null && github.actor != 'github-actions[bot]' && github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage con Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: '*'   # permitir issues de cualquier usuario
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}
            EVENTO: ${{ github.event.action }}

            Eres el asistente de triage de este repositorio (Tetris en JS vanilla; lee CLAUDE.md).
            1. Lee el issue con `gh issue view <n> --repo <repo>`.
            2. Lista las labels existentes con `gh label list --repo <repo>`.
               Si faltan, crea (solo estas) con `gh label create ... --force`:
               tipo: bug, enhancement, question, documentation;
               prioridad: priority:high, priority:medium, priority:low;
               área: area:gameplay, area:rendering, area:input, area:scoring, area:ui, area:ci.
            3. Aplica 1 label de tipo, 1 de prioridad y 1+ de área con `gh issue edit --add-label`.
               En ediciones, quita las labels de triage que ya no apliquen (--remove-label).
            4. Investiga el código relevante (Read/Grep) y escribe un diagnóstico en español:
               resumen, causa probable (con archivo:línea), archivos afectados,
               propuesta de solución paso a paso, complejidad estimada y preguntas abiertas.
            5. Publica el diagnóstico como comentario que empiece con `<!-- claude-triage -->`.
               Si ya existe un comentario con ese marcador (issue editado), actualízalo
               en lugar de crear otro (`gh api` PATCH /repos/<repo>/issues/comments/<id>).
            No modifiques código ni abras PRs.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh label create:*),Bash(gh api:*)"
